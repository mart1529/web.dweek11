<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <link rel="stylesheet" href="styles/grids.css">
</head>
<body>
    <!--
    add a div with the class wrapper, and inside add a head,nav, main and footer, Do not add any placeholder content.-->
    <div class="wrapper">
        <header>
            <h1>Into to CSS Grid</h1>
        </header>
        <nav></nav>
        <main>
            <!--
            inside the main, add four sections, each with a class with different number word (one,two,etc). inside each senction, add h2 wiht the text grid 1, grid 2, etc (incrementing for each section). under the h2, add an article with 8 divs inside. in each div add a p tag with an incrementing number inside (1-8 for each section).-->
            <section class="one">
                <h2>Grid 1</h2>
                <article>
                    <div><p>1</p></div>
                    <div><p>2</p></div>
                    <div><p>3</p></div>
                    <div><p>4</p></div>
                    <div><p>5</p></div>
                    <div><p>6</p></div>
                    <div><p>7</p></div>
                    <div><p>8</p></div>
                </article>
            </section>
            <section class="two">
                <h2>Grid 2</h2>
                <article>
                    <div><p>1</p></div>
                    <div><p>2</p></div>
                    <div><p>3</p></div>
                    <div><p>4</p></div>
                    <div><p>5</p></div>
                    <div><p>6</p></div>
                    <div><p>7</p></div>
                    <div><p>8</p></div>
                </article>
            </section>
            <section class="three">
                <h2>Grid 3</h2>
                <article>
                    <div><p>1</p></div>
                    <div><p>2</p></div>
                    <div><p>3</p></div>
                    <div><p>4</p></div>
                    <div><p>5</p></div>
                    <div><p>6</p></div>
                    <div><p>7</p></div>
                    <div><p>8</p></div>
                </article>
            </section>
            <section class="four">
                <h2>Grid 4</h2>
                <article>
                    <div><p>1</p></div>
                    <div><p>2</p></div>
                    <div><p>3</p></div>
                    <div><p>4</p></div>
                    <div><p>5</p></div>
                    <div><p>6</p></div>
                    <div><p>7</p></div>
                    <div><p>8</p></div>
                </article>
            </section>
        </main>
        <footer></footer>
    </div>
</body>
</html>
